name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Lint and test installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: shellcheck
        run: shellcheck install-dotnet.sh
      - name: bash syntax
        run: bash -n install-dotnet.sh
      - name: self-tests
        run: python -m unittest discover -s tests -v
      - name: dry-run lists all channels
        run: ./install-dotnet.sh --dry-run | tee /tmp/dryrun.txt && grep -q "8.0" /tmp/dryrun.txt && grep -q "9.0" /tmp/dryrun.txt && grep -q "10.0" /tmp/dryrun.txt

  powershell:
    name: Lint PowerShell installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install-dotnet.ps1 -EnableExit
      - name: DryRun lists all channels
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File install-dotnet.ps1 -DryRun | Tee-Object dryrun.txt
          Select-String -Path dryrun.txt -Pattern "8.0" | Out-Null
          Select-String -Path dryrun.txt -Pattern "9.0" | Out-Null
          Select-String -Path dryrun.txt -Pattern "10.0" | Out-Null
