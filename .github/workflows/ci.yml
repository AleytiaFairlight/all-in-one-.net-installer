name: CI

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Lint and test installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: shellcheck
        run: shellcheck install-dotnet.sh
      - name: bash syntax
        run: bash -n install-dotnet.sh
      - name: self-tests
        run: python -m unittest discover -s tests -v
      - name: dry-run lists all channels
        run: |
          ./install-dotnet.sh --dry-run | tee /tmp/dryrun.txt
          grep -q "dotnet-installer" /tmp/dryrun.txt
          # Deterministic missing-channel path (does not depend on the runner's SDKs).
          DOTNET_INSTALL_DIR=/tmp/empty-dotnet ./install-dotnet.sh --dry-run --channel 99.0 | tee /tmp/dryrun-missing.txt
          grep -q "99.0" /tmp/dryrun-missing.txt

  powershell:
    name: Lint PowerShell installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install-dotnet.ps1 -Severity Error -EnableExit
      - name: DryRun lists all channels
        shell: pwsh
        run: |
          $out = & "$PWD/install-dotnet.ps1" -DryRun
          $out | Tee-Object dryrun.txt
          if (-not ($out -match "dotnet-installer")) { throw "dry-run produced no installer output" }
          # Deterministic missing-channel path (does not depend on the runner's SDKs).
          $missing = & "$PWD/install-dotnet.ps1" -DryRun -Channel 99.0
          if (-not ($missing -match "99\.0")) { throw "dry-run missing-channel path broken: $missing" }
