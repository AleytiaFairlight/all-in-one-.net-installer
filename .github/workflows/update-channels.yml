name: Update .NET channels

# Once a month, check Microsoft's supported .NET majors and propose any missing
# channel (e.g. a newly released .NET) as a pull request. Channels are only
# ever added, never removed. Run any time from the Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Propose new .NET channels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Apply channel updates
        id: update
        run: |
          python3 scripts/update-dotnet-channels.py --apply | tee /tmp/channels-update.txt
          NEW="$(sed -n 's/^new-channels: //p' /tmp/channels-update.txt | tail -1)"
          echo "new_channels=$NEW" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- dotnet-versions.env README.md VERSION CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open update PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW="${{ steps.update.outputs.new_channels }}"
          BRANCH="auto/dotnet-channels-$(date -u +%Y%m)"
          if gh pr list --head "$BRANCH" --state open --json number --jq -e '.[0].number' >/dev/null; then
            echo "update PR for $BRANCH is already open; skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add dotnet-versions.env README.md VERSION CHANGELOG.md
          git commit -m "Channels: add .NET ${NEW} (monthly update)"
          git push -u origin "$BRANCH"
          {
            echo "The monthly .NET channel check found new supported major(s): ${NEW}."
            echo
            echo '```'
            cat /tmp/channels-update.txt
            echo '```'
            echo
            echo '### Merge checklist'
            echo '- [ ] Confirm which Dahlia TargetFramework needs the new channel; replace the auto-added README row with its real reason.'
            echo '- [ ] EOL warnings above are informational only: channels are never auto-removed; drop one by hand only if Dahlia no longer targets it.'
            echo '- [ ] After merging, tag the release: bump `VERSION` if the bot changed it meanwhile, then `git tag -a v<VERSION>` and `gh release create`.'
          } > /tmp/pr-body.md
          gh pr create --title "Channels: add .NET ${NEW} (monthly update)" \
            --body-file /tmp/pr-body.md --base main --head "$BRANCH"
